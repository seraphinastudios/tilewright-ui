[workspace]
members = [
  "crates/tilewright-ui",
  "crates/tilewright-app",
  "crates/tilewright-ui-render",
  "crates/tilewright-ui-ffi",
]
resolver = "3"

[workspace.package]
authors = ["Seraphina Studios"]
edition = "2024"
license = "MIT"
repository = "https://github.com/seraphinastudios/tilewright-ui"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
tilewright-ui = { path = "crates/tilewright-ui", version = "=0.1.0" }
tilewright-app = { path = "crates/tilewright-app", version = "=0.1.0" }
tilewright-ui-render = { path = "crates/tilewright-ui-render", version = "=0.1.0" }
unicode-segmentation = "=1.13.3"
tilewright-scene = "=0.6.0"
tilewright-render-ui = "=0.6.0"
tilewright-render-api = "=0.6.0"
tilewright-render-resources = "=0.6.0"
tilewright-render-world = "=0.6.0"
tilewright-render-testkit = "=0.6.0"
tilewright-render-wgpu = "=0.6.0"
tilewright-render-sdl3 = "=0.6.0"
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
serde_json = "=1.0.151"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
