name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/atrinik/linux-build:1.18.0@sha256:613cf43ab07634db005a28462a009c4c28c90dccb1b5175e13e8072b6dfe8d72
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check source, tests and strict Clippy
        run: bash tools/check.sh
      - name: C17 ABI link and lifecycle tests
        run: bash tools/check-c.sh
      - name: Install pinned compiler's browser target
        run: rustup target add --toolchain 1.97.1 wasm32-unknown-unknown
      - name: Browser adapter compile
        run: cargo check --locked --package tilewright-ui-web --target wasm32-unknown-unknown
