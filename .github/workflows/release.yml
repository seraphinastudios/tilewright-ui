name: Release

# Releases tilewright-ui as an immutable GitHub release vX.Y.Z: the source
# archive, the three crates' .crate archives and SHA256SUMS, each with build
# provenance. docs/RELEASING.md describes the whole process.
#
# - push to main: releases when commits since the last release call for
#   one. The first release is never cut by a push.
# - workflow_dispatch on main: the same, and the only way to cut the first
#   release.
# - pull_request touching the release files: plans and packages as a check;
#   never tags, attests or publishes.
#
# The first release at a workspace crate version owns that version of the
# three crates. Its "Start crate publication" job starts the "Publish crates"
# workflow (publish-crate.yml) once every crate name exists on crates.io;
# until the owner's first publication it only says that one is pending.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/publish-crate.yml
      - tools/release/**
      - rust-toolchain.toml
      - Cargo.lock
      - '**/Cargo.toml'

permissions: {}

# Releases of main run one at a time. GitHub keeps one waiting run and
# cancels an older waiting run for a newer one; a newer merge's commit
# contains the older one's, so the next release carries both.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ui-release-check-{0}', github.event.pull_request.number) || format('ui-release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      crate_version: ${{ steps.plan.outputs.crate_version }}
      crate_owner: ${{ steps.plan.outputs.crate_owner }}
      crate_owner_tag: ${{ steps.plan.outputs.crate_owner_tag }}
    steps:
      - name: Check out with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test the release tools
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ ${EVENT} != pull_request && ${GITHUB_REF} != refs/heads/main ]]; then
            echo "::error::releases run from main, not ${GITHUB_REF}"
            exit 1
          fi
          plan="${RUNNER_TEMP}/plan.json"
          python3 tools/release/release.py plan --event "${EVENT}" >"${plan}"
          if [[ $(jq -r .revision "${plan}") != "${GITHUB_SHA}" ]]; then
            echo "::error::the plan is not for ${GITHUB_SHA}"
            exit 1
          fi
          { echo '### Release plan'; echo; echo '```json'; jq . "${plan}"; echo '```'; } >>"${GITHUB_STEP_SUMMARY}"
          echo "::notice title=Release plan::$(jq -r .reason "${plan}")"
          if [[ $(jq -r .crate_changed "${plan}") == true ]]; then
            echo "::notice title=Crate content changed::packaged crate content changed since $(jq -r .crate_owner_tag "${plan}"), which owns crate version $(jq -r .crate_version "${plan}"). It reaches crates.io only with the next crate version (docs/RELEASING.md)."
          fi
          if [[ ${EVENT} == pull_request ]]; then
            # A check build under a version that is never released.
            echo "release=false"
            echo "version=0.0.0-check.${PULL_REQUEST}"
          else
            # null becomes empty; false stays false.
            jq -r '. as $plan | ("release", "version", "previous_tag", "crate_version", "crate_owner",
              "crate_owner_tag") as $key | "\($key)=\(if $plan[$key] == null then "" else $plan[$key] | tostring end)"' "${plan}"
          fi >>"${GITHUB_OUTPUT}"

      # A tag is created before its release is published. If a run failed in
      # between, finish that release first (docs/RELEASING.md).
      - name: Stop at an unfinished release
        if: github.event_name != 'pull_request' && steps.plan.outputs.previous_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.plan.outputs.previous_tag }}
        run: |
          set -euo pipefail
          finished=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PREVIOUS_TAG}" --jq '.draft == false and .immutable == true' || true)
          if [[ ${finished} != true ]]; then
            echo "::error::${PREVIOUS_TAG} has no published immutable release. Finish or repair it first; see \"When a release fails\" in docs/RELEASING.md."
            exit 1
          fi

  package:
    name: Package release assets
    needs: plan
    if: needs.plan.outputs.release == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # A fresh Cargo home: no restored cache and no registry credentials.
      CARGO_HOME: ${{ github.workspace }}/../cargo-home
    steps:
      - name: Check out the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt \
            --target wasm32-unknown-unknown
          cargo --version

      # Cargo's verification build of each packaged crate runs here, with
      # only read access to the repository.
      - name: Package the three crates and the source
        run: |
          set -euo pipefail
          cargo package --locked -p tilewright-ui -p tilewright-app -p tilewright-ui-render
          python3 tools/release/release.py check-crates --dir target/package
          mkdir -p dist
          cp target/package/*.crate dist/
          git archive --format=tar --prefix="tilewright-ui-${VERSION}/" HEAD \
            | gzip -n -9 >"dist/tilewright-ui-${VERSION}-source.tar.gz"
          (cd dist && sha256sum -- * >SHA256SUMS)
          { echo "### Release assets for ${VERSION}"; echo; echo '```'; cat dist/SHA256SUMS; echo '```'; } >>"${GITHUB_STEP_SUMMARY}"

      - name: Keep the assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  attest:
    name: Attest build provenance
    needs: [plan, package]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Collect the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Check the assets against SHA256SUMS
        run: cd dist && sha256sum --check --strict SHA256SUMS

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  release:
    name: Publish the GitHub release
    needs: [plan, attest]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ format('v{0}', needs.plan.outputs.version) }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
      CRATE_VERSION: ${{ needs.plan.outputs.crate_version }}
      CRATE_OWNER: ${{ needs.plan.outputs.crate_owner }}
      CRATE_OWNER_TAG: ${{ needs.plan.outputs.crate_owner_tag }}
    steps:
      - name: Collect the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      # The tag first, at the run's commit. A re-run accepts the tag a failed
      # attempt created at the same commit, and skips a published release.
      - name: Create the tag
        id: tag
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check --strict SHA256SUMS)
          if published=$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq '.draft == false' 2>/dev/null) && [[ ${published} == true ]]; then
            echo "published=true" >>"${GITHUB_OUTPUT}"
          elif ! gh api --method POST "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" >/dev/null; then
            tagged=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq .object.sha)
            if [[ ${tagged} != "${GITHUB_SHA}" ]]; then
              echo "::error::${TAG} already points at ${tagged}, not ${GITHUB_SHA}"
              exit 1
            fi
          fi

      - name: Publish
        if: steps.tag.outputs.published != 'true'
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/releases" --jq ".[] | select(.draft and .tag_name == \"${TAG}\") | .id" |
            while read -r draft; do gh api --method DELETE "repos/${GH_REPO}/releases/${draft}"; done
          notes="${RUNNER_TEMP}/notes.md"
          {
            if [[ ${CRATE_OWNER} == true ]]; then
              echo "This release owns crate version ${CRATE_VERSION} of \`tilewright-ui\`, \`tilewright-app\` and \`tilewright-ui-render\`: their \`.crate\` assets are the bytes published to crates.io."
            else
              echo "Crate version ${CRATE_VERSION} is owned by ${CRATE_OWNER_TAG}; this release's \`.crate\` assets are not published to crates.io."
            fi
            echo
            echo "Check an asset's build provenance with the GitHub CLI:"
            echo
            echo '```sh'
            echo "gh attestation verify FILE --repo ${GH_REPO} \\"
            echo "  --cert-identity https://github.com/${GH_REPO}/.github/workflows/release.yml@refs/heads/main \\"
            echo "  --source-ref refs/heads/main --source-digest ${GITHUB_SHA}"
            echo '```'
          } >"${notes}"
          options=(--verify-tag --title "${TAG}" --notes-file "${notes}" --generate-notes --latest)
          if [[ -n ${PREVIOUS_TAG} ]]; then
            options+=(--notes-start-tag "${PREVIOUS_TAG}")
          fi
          gh release create "${TAG}" dist/* "${options[@]}"

      - name: Check the published release
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/releases/tags/${TAG}" >"${RUNNER_TEMP}/release.json"
          if ! jq -e '.draft == false and .immutable == true' "${RUNNER_TEMP}/release.json" >/dev/null; then
            echo "::error::${TAG} was published, but it is not immutable. Turn immutable releases back on; see docs/RELEASING.md."
            exit 1
          fi
          tagged=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq .object.sha)
          if [[ ${tagged} != "${GITHUB_SHA}" ]]; then
            echo "::error::${TAG} points at ${tagged}, not ${GITHUB_SHA}"
            exit 1
          fi
          cd dist
          diff -u \
            <({ cat SHA256SUMS; sha256sum SHA256SUMS; } | sort -k2) \
            <(jq -r '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' "${RUNNER_TEMP}/release.json" | sort -k2)
          jq -r .html_url "${RUNNER_TEMP}/release.json" >>"${GITHUB_STEP_SUMMARY}"

  crate-publication:
    name: Start crate publication
    needs: [plan, release]
    # Starts "Publish crates" in a run of its own, so a crate publication
    # never holds up a release. Checks out nothing.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ format('v{0}', needs.plan.outputs.version) }}
      CRATE_VERSION: ${{ needs.plan.outputs.crate_version }}
      CRATE_OWNER: ${{ needs.plan.outputs.crate_owner }}
      CRATE_OWNER_TAG: ${{ needs.plan.outputs.crate_owner_tag }}
    steps:
      - name: Start or report crate publication
        run: |
          set -euo pipefail
          command="gh workflow run publish-crate.yml --ref main -R ${GH_REPO} -f operation=publish -f credential=trusted-publishing -f release_tag=${CRATE_OWNER_TAG}"
          report() { echo "::notice::$1"; printf '### Crate publication\n\n%s\n' "$1" >>"${GITHUB_STEP_SUMMARY}"; }
          if [[ ${CRATE_OWNER} != true ]]; then
            report "Crate version ${CRATE_VERSION} is owned by ${CRATE_OWNER_TAG}, so ${TAG} publishes no crates. To finish that publication if it is incomplete: ${command}"
            exit 0
          fi
          # A crate name crates.io lacks needs the owner's first publication;
          # trusted publishing cannot create one.
          absent=()
          for crate in tilewright-ui tilewright-app tilewright-ui-render; do
            status=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' "https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}")
            case ${status} in
              200) ;;
              404) absent+=("${crate}") ;;
              *) echo "::error::crates.io's index answered ${status} for ${crate}; start the publication later with: ${command}"; exit 1 ;;
            esac
          done
          if [[ ${#absent[@]} -gt 0 ]]; then
            report "First publication pending: crates.io has no crate named ${absent[*]} yet. ${TAG} owns crate version ${CRATE_VERSION}; the owner publishes it by following docs/CRATE-FIRST-PUBLICATION.md. Nothing was started."
            exit 0
          fi
          gh workflow run publish-crate.yml --ref main -R "${GH_REPO}" -f operation=publish \
            -f credential=trusted-publishing -f release_tag="${TAG}"
          report "Started \"Publish crates\" for ${TAG}, which owns crate version ${CRATE_VERSION}. To start it again: ${command}"
