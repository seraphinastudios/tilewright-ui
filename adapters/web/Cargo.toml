[package]
name = "tilewright-ui-web"
description = "Unpublished browser host adapter for Tilewright shared UI"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tilewright-ui.workspace = true
tilewright-app.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = ["HtmlCanvasElement"] }
tilewright-render-api.workspace = true
tilewright-render-resources.workspace = true
tilewright-render-testkit.workspace = true
tilewright-render-wgpu.workspace = true

[lints]
workspace = true
